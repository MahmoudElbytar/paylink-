# CI workflow: runs when code is pushed or a pull request is created
name: CI

on:
  push:
  pull_request:

jobs:
  # First job: install dependencies, check code, build, and test
  build-test:
    runs-on: ubuntu-latest
    steps:
      # Get the project code
      - uses: actions/checkout@v4

      # Set up Node.js 22 and enable npm caching
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install project dependencies
      - run: npm ci

      # Check code quality and TypeScript syntax
      - name: Lint
        run: npm run lint

      # Build the application
      - name: Build
        run: npm run build

      # Run tests and check the 70% line coverage requirement
      - name: Test with coverage
        run: npm run test:cov

      # Display coverage results without failing if the report is missing
      - name: Coverage summary
        if: always()
        run: |
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"

          if [ -f coverage/coverage-summary.json ]; then
            node -e "const s=require('./coverage/coverage-summary.json').total;console.log('Lines: '+s.lines.pct+'%  Branches: '+s.branches.pct+'%')" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Save the coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  # Second job: build and test the application using Docker
  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      # Get the project code
      - uses: actions/checkout@v4

      # Build the Docker image
      - name: Build image
        run: docker build -t paylink:${{ github.sha }} .

      # Start containers and check application health
      - name: Start stack and health check
        run: |
          docker compose up -d --build

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health | grep -q '"db":"up"'; then echo healthy; exit 0; fi
            sleep 3
          done

          # Display logs if the health check fails
          docker compose logs
          exit 1

      # Stop containers and remove volumes after the job
      - name: Tear down
        if: always()
        run: docker compose down -v

      # Stop containers and remove volumes after the job finishes
      - name: Tear down
        if: always()
        run: docker compose down -v
