services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: paylink
      POSTGRES_DB: paylink
    volumes:
      - pgdata:/var/lib/postgresql/data
      # migrations in the repo run automatically on first start
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink -d paylink"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://paylink:paylink@db:5432/paylink
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
